name: human4ai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Тесты: на бесплатном раннере GitHub, серверу для этого напрягаться незачем ──
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Типы
        run: npx tsc --noEmit

      - name: Тесты
        run: npm test

  # ── Сборка и деплой прямо на сервере ─────────────────────
  # Раннер живёт на том же сервере, поэтому образ не гоняется через реестр:
  # собрали локально и сразу подменили контейнер. SSH-ключ для этого не нужен.
  deploy:
    name: Build & Deploy
    runs-on: [self-hosted, paulislava]
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      IMAGE: human4ai:${{ github.sha }}
      PORT: 4020

    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t "$IMAGE" .

      - name: Подмена контейнера
        env:
          CLIENT_TOKENS: ${{ secrets.CLIENT_TOKENS }}
          TELEGRAM_CAPTCHA_BOT_TOKEN: ${{ secrets.TELEGRAM_CAPTCHA_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GPT2GIGA_BASE_URL: ${{ secrets.GPT2GIGA_BASE_URL }}
          GIGACHAT_MODEL: ${{ secrets.GIGACHAT_MODEL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_SHIM_URL: ${{ secrets.CLAUDE_SHIM_URL }}
          CLAUDE_SHIM_TOKEN: ${{ secrets.CLAUDE_SHIM_TOKEN }}
          DEFAULT_TIMEOUT_MS: ${{ secrets.DEFAULT_TIMEOUT_MS }}
          VOICE_ALICE_SECRET: ${{ secrets.VOICE_ALICE_SECRET }}
          VOICE_ALICE_ALLOWED_USERS: ${{ secrets.VOICE_ALICE_ALLOWED_USERS }}
          VOICE_YANDEX_TOKEN: ${{ secrets.VOICE_YANDEX_TOKEN }}
          VOICE_PC_PROXY: ${{ secrets.VOICE_PC_PROXY }}
          VOICE_STATION: ${{ vars.VOICE_STATION }}
          VOICE_STATION_NAMES: ${{ vars.VOICE_STATION_NAMES }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -e

          # База задач — в томе: она не часть образа и переживает деплой.
          docker volume create human4ai-data >/dev/null

          # Общая сеть с gpt2giga-proxy: ступень GigaChat обращается к нему по
          # имени контейнера, а не через порт на хосте.
          docker network create human4ai >/dev/null 2>&1 || true

          # Старый контейнер держим до успешного health-check — иначе неудачный
          # деплой оставил бы службу лежать.
          OLD_ID=$(docker ps -q --filter "publish=$PORT")
          if [ -n "$OLD_ID" ]; then
            docker stop "$OLD_ID"
          fi

          NEW_ID=$(docker run -d --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            --network human4ai \
            -p "$PORT:3200" \
            -v human4ai-data:/data \
            -e CLIENT_TOKENS="$CLIENT_TOKENS" \
            -e TELEGRAM_CAPTCHA_BOT_TOKEN="$TELEGRAM_CAPTCHA_BOT_TOKEN" \
            -e TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            -e GPT2GIGA_BASE_URL="$GPT2GIGA_BASE_URL" \
            -e GIGACHAT_MODEL="$GIGACHAT_MODEL" \
            -e CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            -e CLAUDE_SHIM_URL="$CLAUDE_SHIM_URL" \
            -e CLAUDE_SHIM_TOKEN="$CLAUDE_SHIM_TOKEN" \
            -e DEFAULT_TIMEOUT_MS="$DEFAULT_TIMEOUT_MS" \
            -e VOICE_ALICE_SECRET="$VOICE_ALICE_SECRET" \
            -e VOICE_ALICE_ALLOWED_USERS="$VOICE_ALICE_ALLOWED_USERS" \
            -e VOICE_YANDEX_TOKEN="$VOICE_YANDEX_TOKEN" \
            -e VOICE_PC_PROXY="$VOICE_PC_PROXY" \
            -e VOICE_STATION="$VOICE_STATION" \
            -e VOICE_STATION_NAMES="$VOICE_STATION_NAMES" \
            -e MCP_TOKEN="$MCP_TOKEN" \
            -e PUBLIC_URL="$PUBLIC_URL" \
            "$IMAGE")

          SUCCESS=0
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check пройден"
              SUCCESS=1
              break
            fi
            echo "Попытка $i: статус $STATUS, жду 3 с..."
            sleep 3
          done

          if [ "$SUCCESS" = "1" ]; then
            # Ступени печатаются в лог на старте — сразу видно, что подключено.
            docker logs "$NEW_ID" 2>&1 | tail -3
            [ -n "$OLD_ID" ] && docker rm "$OLD_ID"
            docker image prune -f --filter "until=168h" || true
          else
            echo "Health check не прошёл — откатываюсь"
            docker logs "$NEW_ID" || true
            docker stop "$NEW_ID" || true
            docker rm "$NEW_ID" || true
            [ -n "$OLD_ID" ] && docker start "$OLD_ID"
            exit 1
          fi
